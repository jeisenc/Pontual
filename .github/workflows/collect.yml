name: Collect delays

# Every 15 minutes: check trains that should have finished, save their delays.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect
        run: python collector/collect.py

      - name: Save data
        run: |
          git config user.name  "pontual-bot"
          git config user.email "pontual-bot@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "nothing new"; exit 0; fi
          git commit -q -m "data: $(TZ=Europe/Lisbon date '+%Y-%m-%d %H:%M')"
          for i in 1 2 3; do
            git pull -q --rebase && git push -q && exit 0
            sleep 5
          done
          exit 1
