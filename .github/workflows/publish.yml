name: Publish dashboard

# Hourly: rebuild the statistics and redeploy the site to GitHub Pages.
on:
  schedule:
    - cron: "41 * * * *"
  push:
    paths: ["site/index.html", "collector/build_stats.py"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build statistics
        run: |
          if [ -f data/stations.json ]; then python collector/build_stats.py; else echo "no data yet"; fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
